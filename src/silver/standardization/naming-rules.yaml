version: 1

language:
  logical_name: ko
  physical_name: en

rules:
  physical_case: lower_snake_case
  physical_name_pattern: '^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$'

  entity_noun_number: singular
  word_separator: '_'

  identifier_suffix: '_id'
  code_suffix: '_code'
  date_suffix: '_date'
  datetime_suffix: '_datetime'
  boolean_prefix: 'is_'

  approved_abbreviations:
    - id

  prohibited_legacy_abbreviations:
    - no
    - nm
    - p_area
    - mgr
    - emp
    - dept
    - pos
    - lvl
    - reg
    - dtm
    - act
    - yn

examples:
  valid:
    - area_id
    - area_name
    - parent_area_id
    - parent_area_name
    - top_area_id
    - top_area_name
    - top_area_level_code
    - employee_id
    - employee_name
    - employee_department_name
    - employee_position_name
    - employee_hire_datetime
    - employee_status_code
    - area_registration_date
    - top_area_registration_date

  invalid:
    - area_no
    - p_area_no
    - top_area_lvl
    - mgr_no
    - mgr_nm
    - mgr_act_yn
    - employee_hire_dtm
    - employee_active_yn
    - department_name
    - position_name
    - hire_date
    - is_active
    - employeeId
    - employees_id
